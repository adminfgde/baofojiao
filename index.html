<script id="d" type="application/json">[{"ch": "第一章", "title": "绪论", "items": [{"title": "一、中国环境十大问题", "content": "1）大气污染日益加重 2）水体污染问题突出 3）固体废物急剧增加 4）噪声污染普遍超标 5）土地荒漠化加剧 6）水土流失严重 7）水资源短缺 8）生物多样性锐减 9）耕地减少、土壤污染 10）海洋环境污染"}, {"title": "二、环境管理含义", "content": "运用行政、法律、经济、教育、技术等手段，协调经济社会发展与环境保护之间的关系，限制人类损害环境质量的活动，防治环境污染与生态破坏，保障经济社会可持续发展。"}, {"title": "三、环境规划含义", "content": "对一定时期、一定区域内环境保护目标、任务、措施、资金、工程布局做出预先安排，是国民经济和社会发展规划的组成部分，是环境管理的首要职能。"}, {"title": "四、对象、手段、关系、目的、任务、作用", "content": "对象：人（社会经济活动主体）；社会经济—自然复合生态系统。手段：行政、法律、经济、技术、宣传教育。关系：规划是管理的先导与依据，管理是规划落地的保障。目的：协调发展与保护，保障环境质量，实现可持续发展。任务：调控行为、控制污染、保护生态、合理利用资源。作用：宏观调控、约束排污、优化布局、保障目标、推动生态文明。"}, {"title": "五、生态学三定律", "content": "①物物相关律：生态系统各组分相互联系制约 ②相生相克律：生物间捕食竞争关系维持系统平衡 ③负载定额律：生态系统存在承载力上限，不能无限索取排污。"}, {"title": "六、环境容量与环境承载力", "content": "环境容量：不突破环境质量标准和不破坏生态平衡前提下，某一环境单元所能容纳污染物的最大排放量（只针对污染物）。环境承载力：区域资源环境能够持续支撑的人口规模、经济发展规模、资源开发强度（涵盖资源、环境、生态综合要素）。联系：环境容量是环境承载力的污染排放子项；二者都存在阈值。区别：环境容量只针对污染物；环境承载力综合性更强。"}, {"title": "七、生态链原理与工业生态学", "content": "物质在食物链、产业链逐级传递；工业生态学模仿自然生态系统构建产业共生链条；生态工业园实现企业间废物交换、资源循环利用，变废料为原料。"}, {"title": "八、生物多样性原理（环境伦理三观）", "content": "1）生命中心主义：尊重一切生命物种生存权 2）地球整体主义：生物圈是不可分割的有机整体 3）代际均等伦理：当代人不能透支后代资源与环境。"}, {"title": "九、可持续发展原理", "content": "定义：既满足当代人的需求又不损害后代人满足其需求的发展。三大原则：公平性、持续性、共同性。研究内容：经济增长模式、GDP绿色核算、资源高效利用、污染总量控制。"}, {"title": "十、两山论原理", "content": "绿水青山就是金山银山。生态环境保护本身就是生产力，统筹生态保护与经济发展，实现生态优势转化为经济优势。"}, {"title": "十一、环境经济学原理", "content": "基本观念：环境资源稀缺、有价、污染存在外部成本。核心理论：外部性理论——负外部性（企业排污转嫁治理成本给社会）、正外部性（植树造林给全社会带来环境收益）。方法：排污收费、排污权交易、生态补偿、环境税费。"}, {"title": "十二、复合生态系统论", "content": "定义：社会—经济—自然三大子系统耦合形成的复杂系统。子系统：自然子系统（资源环境基础）、经济子系统（物质生产流通）、社会子系统（人口制度文化）。功能：生产、生活、还原自净。矛盾：经济发展需求无限与自然资源环境容量有限之间的矛盾。"}, {"title": "十三、管理二重性原理", "content": "自然属性（生产力属性）：合理组织生产力、协调技术与资源配置。社会属性（生产关系属性）：体现社会制度、利益分配、公共治理目标。管理五大职能：计划、组织、指挥、协调、控制。"}, {"title": "十四、中国三大产业", "content": "第一产业：农林牧渔业。第二产业：工业、建筑业。第三产业：服务业（流通、文旅、金融、公共服务等）。"}], "questions": [{"q": "结合实例论述环境规划与管理的重要性。", "a": "案例：长三角流域水污染联防联控规划。1）若无统一流域规划：上下游各行其是，上游排污下游水质恶化，治理碎片化效果差。2）实施规划+管理：统一水质目标、排污总量、监测执法，实施产业准入管控、污水集中治理、生态补偿。3）重要性：①规划明确目标布局避免盲目开发 ②管理保障规划落地约束排污 ③解决跨区域环境矛盾 ④统筹经济发展与生态保护 ⑤把环境容量作为发展底线守住生态红线。"}, {"q": "什么是管理的二重性特点？试剖析我国环境管理中存在的主要问题。", "a": "二重性：自然属性（科学配置资源、管控排污总量、优化治理技术）；社会属性（代表公共环境利益，平衡企业利益与公众健康）。现存问题：自然属性层面——区域规划科学性不足、容量测算不到位、治理技术推广不均衡；社会属性层面——地方政府重经济轻环保、跨区域生态补偿不完善、公众监督渠道不畅、执法尺度地方差异。"}, {"q": "简述计划、组织、控制职能的含义与作用。", "a": "1）计划职能：预先制定环保目标方案时序安排，作用：明确行动方向避免无序。2）组织职能：设置环保机构划分权责配置人员资金，作用：搭建组织保障。3）控制职能：监测质量核查排污数据考核目标完成情况及时纠偏，作用：保障规划不偏离目标。"}, {"q": "什么是环境容量？什么是环境承载力？试分析两者关系。", "a": "环境容量：不突破环境质量标准和不破坏生态平衡前提下，环境单元所能容纳污染物的最大排放量。环境承载力：区域资源环境能够持续支撑的人口规模、经济发展规模、资源开发强度。联系：环境容量是承载力的污染排放子项，都存在阈值。区别：环境容量只针对污染物，承载力涵盖资源供给、纳污能力、生态支撑综合性更强。"}, {"q": "简述工业生态学的定义及其内涵。", "a": "定义：模仿自然生态系统物质循环规律，研究产业系统内物质能量高效循环，构建产业共生体系的交叉学科。内涵：1）物质闭路循环最大限度减少废物 2）能量梯级利用提高能效 3）企业间形成共生网络，废弃物变原料 4）从源头实现减污降碳支撑生态工业园建设。"}]}, {"ch": "第二、三章", "title": "政策方针、法律法规", "items": [{"title": "一、32字环保方针", "content": "全面规划，合理布局，综合利用，化害为利，依靠群众，大家动手，保护环境，造福人民。"}, {"title": "二、基本国策与战略方针", "content": "环境保护是我国一项基本国策。三同步：经济建设、城乡建设、环境建设同步规划、同步实施、同步发展。三统一：经济效益、社会效益、环境效益相统一。"}, {"title": "三、环境管理三大基本政策", "content": "①预防为主，防治结合 ②谁污染谁治理 ③强化环境管理"}, {"title": "四、四类配套政策", "content": "产业政策（淘汰高污染产业）、技术政策（推广清洁生产技术）、环境经济政策（税费、排污权、生态补偿）、生态环境政策（生态红线、自然保护地管理）。"}, {"title": "五、三类环境法律责任", "content": "1）行政责任：警告、罚款、责令停产、限期治理、吊销证照。2）民事责任：污染损害赔偿、恢复生态，无过错责任。3）刑事责任：污染环境罪，追究企业负责人刑罚。"}, {"title": "六、七层环保法规体系", "content": "1）宪法（最高依据）2）《环境保护法》（基本法）3）单行法：污染防治法、资源法、自然保护法 4）其他法律：刑法、行政法相关条款 5）国务院部门规章 6）地方性环保法规 7）我国缔结生效的国际环境公约"}, {"title": "七、八项环境管理制度", "content": "1）环境影响评价制度 2）三同时制度 3）排污收费制度 4）排污许可证制度 5）限期治理制度 6）环境保护目标责任制 7）城市环境综合整治定量考核制度 8）污染集中控制制度"}, {"title": "八、环境标准体系", "content": "性质：技术法规，具有强制执行力。五类：环境质量标准、污染物排放标准、环境基础标准、环境方法标准、环境样品标准。两级：国家标准、地方标准（地方严于国标）。五大作用：执法依据、规划基准、排污管控标尺、环境评价依据、治理技术标尺。"}, {"title": "九、三大管控手段", "content": "行政政治手段、经济手段、技术手段。"}], "questions": [{"q": "简述中国环境与发展十大对策。", "a": "1）实行可持续发展战略 2）采取有效措施防治工业污染 3）深入开展城市环境综合整治 4）提高能源利用效率改善能源结构 5）推广生态农业坚持不懈植树造林 6）加强生物多样性保护 7）积极治理水污染保护淡水资源 8）严格控制人口增长 9）加强环境教育提高全民族环境意识 10）健全环境法制强化环境管理。"}, {"q": "试分析环境政策与环境管理制度的关系。", "a": "政策是顶层指导思想（预防为主、谁污染谁治理等）；制度是政策落地的制度化规则（环评、三同时、排污许可等）。政策指导制度制定，制度把政策固化为可执行的法律规则。"}, {"q": "说明我国环境保护法规体系的构成（七层次）。", "a": "1）宪法（最高依据）2）《环境保护法》（基本法）3）单行法（污染防治法、资源法、自然保护法）4）其他法律（刑法、行政法相关条款）5）国务院部门规章 6）地方性环保法规 7）我国缔结生效的国际环境公约。"}, {"q": "试比较2000年《大气污染防治法》第二次修订的主要变化及发展动向。", "a": "变化：强化总量控制制度从浓度管控转向总量+浓度双控；细化燃煤污染治理划定酸雨与二氧化硫控制区；新增机动车尾气污染管控条款；加大行政处罚力度。发展动向：由单一污染源治理走向区域联防联控，从末端治理转向总量前置管控，固定源+移动源协同治理。"}, {"q": "试比较1984版与1996版《水污染防治法》的变化及发展动向。", "a": "变化：增设流域管理条款、实施排污总量控制、完善排污申报制度、细化饮用水水源保护区管理、提高处罚额度。发展动向：从点源管控走向流域综合管控，重视饮用水安全，强化事前预防。"}, {"q": "试分析规划环评设立的原因与目的。", "a": "原因：单纯项目环评无法解决区域产业布局不合理带来的区域性污染，产业规划会带来群体性环境影响。目的：从宏观产业规划源头预防污染，优化空间布局，避免区域性生态破坏，把环保要求落实在规划编制阶段。"}, {"q": "逐条解释八项环境管理制度。", "a": "1）环境影响评价制度：建设项目专项规划开工前预测环境影响提出防治措施。2）三同时：污染防治设施与主体工程同时设计同时施工同时投产。3）排污收费：向排污单位征收排污费倒逼治污。4）排污许可证：持证排污核定种类总量浓度。5）限期治理：严重污染企业限时完成治理逾期关停。6）目标责任制：地方政府层层签责任书党政同责。7）城市综合整治定量考核：对大气水固废噪声量化打分。8）污染集中控制：集中建设污水处理厂固废处置中心连片治理。"}, {"q": "说明环境标准的分类方法及常用标准。", "a": "五类两级。五类：环境质量标准、污染物排放标准、基础标准、方法标准、样品标准。两级：国家标准（国标）、地方标准（地标严于国标）。常用：环境质量GB3095大气、GB3838地表水、GB3096声环境；排放标准：污水综合排放标准、大气污染物综合排放标准等。"}]}, {"ch": "第四章", "title": "综合分析方法", "items": [{"title": "一、环境现状调查四大内容", "content": "①环境特征（自然、社会经济、污染源）②生态调查 ③污染源调查 ④环境质量调查"}, {"title": "二、三种调查方法", "content": "收集资料法（省钱覆盖面广精度低）、现场实测法（精度高成本高）、遥感法（大范围生态监测）。"}, {"title": "三、环境评价内容", "content": "自然环境评价、社会经济评价、环境质量评价。"}, {"title": "四、环境预测方法", "content": "定性预测（专家判断）；定量预测（回归分析、模型模拟）。"}, {"title": "五、决策三准则", "content": "乐观决策（大中取大）：选每种方案最大收益再选最大值。悲观决策（小中取大）：选每种方案最小收益再选最大值。等可能性决策：假定各状态概率相等计算均值择优。"}, {"title": "六、环境统计", "content": "包含污染源、排放总量、治理设施、环境质量指标，用于核算污染底数。"}], "questions": [{"q": "简述环境现状调查的内容和方法。", "a": "内容：环境特征、生态、污染源、环境质量。方法：收集资料法（省钱覆盖面广精度低）、现场实测法（精度高成本高）、遥感法（大范围生态监测）。"}, {"q": "简述环境评价的内容和方法。", "a": "内容：自然环境评价、社会经济评价、环境质量评价。方法：指数评价法、模型评价法。"}, {"q": "简述环境目标的组成。", "a": "质量目标、总量控制目标、生态保护目标。"}, {"q": "简述环境规划与管理指标体系的组成。", "a": "环境质量指标、污染物排放指标、生态指标、治理工程指标、经济投入指标。"}, {"q": "简述环境统计的内容及方法。", "a": "内容：排污量、治理投资、设施运行、监测数据。方法：普查、年报、抽样调查。"}, {"q": "简述社会发展预测的主要方法。", "a": "人口预测、城镇化预测（回归模型、增长系数法）。"}, {"q": "简述经济发展预测的主要方法。", "a": "GDP、产业产值、工业增速预测（回归模型、增长系数法、弹性系数法）。"}, {"q": "简述环境质量预测的主要方法。", "a": "数学模型法、趋势外推法、情景分析法。"}, {"q": "简述环境审计的方法和内容。", "a": "核查排污台账、治理设施运行、环保资金使用，核实排污数据真实性。"}, {"q": "简述环境管理信息系统的组成和设计方法。", "a": "组成：数据库、监测模块、预测模块、决策模块。方法：依托监测网络搭建。"}, {"q": "为减少环境统计缺口性指标可采取哪些措施？", "a": "完善基层监测点位、健全企业自动在线监控、强化排污台账核查、缩小未纳管小企业统计盲区。"}, {"q": "简述乐观、悲观、等可能性三种决策准则。", "a": "乐观（大中取大）：选每种方案最大收益再选最大值。悲观（小中取大）：选每种方案最小收益再选最大值。等可能性：假定各状态概率相等计算均值择优。"}]}, {"ch": "第五章", "title": "环境规划基本内容与程序", "items": [{"title": "一、六大基本原则", "content": "经济社会与环境协调、预防为主、因地制宜、分区管控、依靠科技、公众参与。"}, {"title": "二、工作程序", "content": "现状调查→环境评价与预测→确定规划目标→功能区划→规划方案设计→方案优选→规划审批→实施跟踪。"}, {"title": "三、环境功能区划类型", "content": "空气功能区、地表水功能区、声环境功能区、城市综合环境功能区。"}], "questions": [{"q": "简述环境规划的工作程序。", "a": "现状调研→评价预测→目标制定→功能区划→方案编制→方案决策→审批实施→监督调整。"}, {"q": "简述环境规划目标与指标体系间的关系。", "a": "目标是定性要求，指标是目标量化数值；指标体系支撑目标落地。"}, {"q": "说明环境规划指标体系包括哪些内容。", "a": "环境质量、污染物总量、生态保护、污染治理、环保投入五大类指标。"}, {"q": "论述环境评价和环境预测的主要内容。", "a": "环境评价：现状质量评价。环境预测：未来排污与质量变化趋势预测。"}, {"q": "什么是环境功能区划？主要类型有哪些？", "a": "按使用用途划分管控区域执行对应质量标准。类型：大气功能区、地表水功能区、噪声功能区、城市生态功能区。"}, {"q": "环境规划方案的设计和决策怎样进行？", "a": "先提出多套备选方案，从环境效益、经济效益、技术可行性综合比选，选出最优方案。"}, {"q": "简述环境规划实施的条件。", "a": "组织保障、资金保障、法规政策保障、监测考核保障。"}]}, {"ch": "第六章", "title": "大气、水、固废、生态专项规划", "items": [{"title": "一、大气环境规划", "content": "内容：污染源调查、质量现状评价、污染预测、规划目标、总量控制、治理工程、监督管理。总量控制方法：目标总量控制、容量总量控制（基于环境容量核定排放量）。防治措施：能源结构调整、工业废气治理、扬尘管控、机动车尾气治理、区域联防联控。"}, {"title": "二、水环境规划", "content": "水功能区划原则：优先保障饮用水源、上下游统筹、分河段管控。水污染防治：截污纳管、污水处理厂提标、面源农业污染治理、河湖生态修复。"}, {"title": "三、固体废物规划", "content": "内容：产生量预测、分类收集、资源化利用、无害化处置布局。填埋场选址原则：远离水源地居民区、地质稳定、地下水位低、风向合理。"}, {"title": "四、生态规划", "content": "内涵：优化城乡空间格局，保护生态红线，修复受损生态系统，提升生物多样性。生态工业园：构建企业物质循环链，实现废物交换、能量梯级利用。"}], "questions": [{"q": "假设要对乌鲁木齐市某工业园区进行规划，请问怎么开展工作？", "a": "1）现状调查：工业污染源、大气与水环境质量、区域生态、土地利用 2）环境评价测算区域大气水环境容量 3）划定环境功能区确定排放总量上限 4）制定产业准入清单禁止高污染项目入园 5）规划集中污水处理废气治理固废处置设施 6）编制循环化改造方案打造生态产业链 7）制定监测方案管理制度应急预案 8）规划环评+报批，落地实施与跟踪管控。"}, {"q": "简述大气环境规划的内容和步骤。", "a": "内容：污染源调查、质量评价、污染预测、规划目标、总量控制、治理工程、监督管理。步骤：调查评价→预测→目标确定→总量分配→措施制定→监督实施。"}, {"q": "简述大气污染源调查的主要内容。", "a": "点源（位置高度排放强度）、面源（区域分散源）、线源（交通道路）。参数：种类、排放量、时间规律、温度速度。"}, {"q": "简述大气污染物总量控制的主要方法及防治措施。", "a": "方法：目标总量控制、容量总量控制（基于环境容量）。防治措施：能源结构调整、工业废气治理、扬尘管控、机动车尾气治理、区域联防联控。"}, {"q": "简述水环境功能区划的原则和方法。", "a": "原则：优先保障饮用水源、上下游统筹、分河段管控。方法：识别功能→确定水质目标→划分保护区缓冲区→制定管理要求。"}, {"q": "水污染物预测主要包括哪些内容？", "a": "生活污水工业废水排放量预测、面源污染负荷预测、水质模型预测（S-P模型BOD-DO）。"}, {"q": "简述水污染综合防治措施。", "a": "截污纳管、污水处理厂提标、面源农业污染治理、河湖生态修复、排污许可在线监测。"}, {"q": "简述固体废物管理规划的主要内容。", "a": "产生量预测、分类收集、资源化利用、无害化处置布局。"}, {"q": "固体废物处置选址的原则有哪些？", "a": "远离水源地居民区、地质稳定、地下水位低、风向合理、交通便利、公众接受度。"}, {"q": "简述生态规划的内涵。", "a": "优化城乡空间格局，保护生态红线，修复受损生态系统，提升生物多样性。"}, {"q": "简述生态调查的主要内容和方法。", "a": "内容：生态系统类型分布、生物多样性、植被覆盖、生态敏感性。方法：实地调查、遥感GIS、生态模型。"}, {"q": "城市生态规划与生态城市的关系？", "a": "城市生态规划是建设生态城市的手段和路径，生态城市是规划目标和愿景。"}, {"q": "城市生态规划的主要内容？", "a": "生态功能区划、绿地系统、生态廊道、生物多样性保护、生态产业、循环经济。"}, {"q": "简述生态工业园区规划的主要内容。", "a": "构建企业物质循环链实现废物交换能量梯级利用，基础设施共享，环境管理体系，典型案例丹麦卡伦堡、广西贵港。"}]}, {"ch": "第七章", "title": "环境管理模式", "items": [{"title": "一、末端控制（传统模式）", "content": "含义：污染物产生后再进行治理。弊端：①治理成本高 ②只处理排污口不能减少资源消耗 ③易产生二次污染 ④难以解决区域性污染 ⑤企业被动治污。"}, {"title": "二、污染预防（现代模式）", "content": "源头削减、全过程管控。循环经济3R原则：减量化（Reduce）优先、再利用（Reuse）、资源化（Recycle）。发达国家模式：德国侧重垃圾回收资源化，日本构建全社会循环型社会。"}, {"title": "三、清洁生产与生命周期评价", "content": "清洁生产：源头改进工艺原料减少污染物产生；清洁生产审计是诊断高物耗高污染环节的工具。生命周期评价：从原料开采—生产—使用—废弃全链条评估环境影响。"}], "questions": [{"q": "末端控制的弊端有哪些？", "a": "①治理成本高 ②只处理排污口不能减少资源消耗 ③易产生二次污染 ④难以解决区域性污染 ⑤企业被动治污。"}, {"q": "何谓末端控制？其主要特征是什么？", "a": "污染物产生后再进行治理。特征：事后治理、只管控排污口、以浓度达标为主、被动治理。"}, {"q": "我国末端行政管控与发达国家命令控制型措施有无显著区别？表现在哪些方面？", "a": "有显著区别。我国行政干预更强，关停并转行政手段多；发达国家更多依靠法制+排污收费等经济手段。我国以红头文件为主，发达国家以法律标准为核心。"}, {"q": "试客观评价末端控制传统环境管理模式实践的作用。", "a": "在工业化初期有效遏制污染恶化，建成大量治理设施；但治标不治本，无法实现资源高效利用，难以支撑可持续发展。"}, {"q": "何谓污染预防？它与末端控制的根本区别是什么？", "a": "污染预防是在污染物产生之前削减废物。根本区别：源头预防 vs 末端补救。"}, {"q": "实施污染预防环境管理模式的主要途径有哪些？", "a": "清洁生产、产业结构调整、产品生态设计、循环经济、总量前置管控。"}, {"q": "污染预防环境管理模式的基本内容有哪些？", "a": "源削减、全过程管控、3R循环、生态设计、环境绩效审计。"}, {"q": "污染预防环境管理模式实施中可能存在的困难有哪些？", "a": "企业技改资金投入大、中小企业技术不足、跨企业产业链共生协调难度大、制度激励不足。"}, {"q": "何谓目标管理？简述其基本思想特点及实施步骤。", "a": "将环保总目标逐级分解到部门与企业，明确考核指标分步落地。特点：权责清晰量化考核。步骤：目标分解→制定措施→过程监督→绩效考核。"}]}, {"ch": "第八章", "title": "区域环境管理", "items": [{"title": "一、区域环境管理原则", "content": "统筹协调、分区管控、陆海统筹、流域共治、预防优先。"}, {"title": "二、农村环境管理", "content": "问题：农业面源污染、畜禽养殖污染、生活垃圾无序堆放、地下水污染。措施：农村污水收集、粪污资源化、生活垃圾集中处置、化肥农药减量。"}, {"title": "三、流域环境管理", "content": "问题：跨界水污染。成因：上下游行政分割、排污缺乏统一管控。方法：统一规划、统一监测、生态补偿、联防联控。"}, {"title": "四、海洋环境管理", "content": "问题：陆源排污、近海养殖污染、溢油风险。途径：陆海统筹、入海排污口整治、海岸生态修复。"}, {"title": "五、开发区环境管理", "content": "问题：产业扎堆污染集中布局不合理。途径：严格规划环评、实行总量准入、集中建设环保基础设施、园区循环化改造。"}], "questions": [{"q": "简述区域环境管理的含义和原则。", "a": "含义：对一定区域内人类活动进行协调调控，使区域环境与社会经济协调发展。原则：统筹协调、分区管控、陆海统筹、流域共治、预防优先。"}, {"q": "简述农村环境问题及改善措施。", "a": "问题：农业面源污染、畜禽养殖污染、生活垃圾无序堆放、地下水污染。措施：农村污水收集、粪污资源化、生活垃圾集中处置、化肥农药减量。"}, {"q": "简述流域环境问题成因及管理方法。", "a": "问题：跨界水污染。成因：上下游行政分割排污缺乏统一管控。方法：统一规划、统一监测、生态补偿、联防联控。"}, {"q": "简述海洋环境问题成因及管理途径。", "a": "问题：陆源排污、近海养殖污染、溢油风险。途径：陆海统筹、入海排污口整治、海岸生态修复。"}, {"q": "开发区存在的主要环境问题有哪些？", "a": "产业扎堆污染集中、布局不合理、基础设施不配套、环境风险叠加。"}, {"q": "简述开发区环境管理的基本途径和方法。", "a": "严格规划环评、实行总量准入、集中建设环保基础设施、园区循环化改造。"}, {"q": "规划是如何实现其环境管理的？", "a": "通过功能区划确定环保要求，总量控制分配容量，环评预防新污染，排污许可一证式管理，监测监察落实，绩效评估反馈调整。"}, {"q": "我国环保模范城市有哪些？新疆有哪些城市入选？", "a": "环保模范城市：深圳厦门杭州成都南京青岛大连宁波苏州珠海威海张家港等。新疆入选：乌鲁木齐、克拉玛依、库尔勒等。"}]}, {"ch": "第九章", "title": "行业环境管理", "items": [{"title": "行业环境管理通用要点", "content": "【大气污染】特征：窑炉烟气、粉尘、VOC。防治：除尘、脱硫脱硝、废气收集治理、密闭生产。\n【水污染】特征：生产废水、清洗废水。防治：清污分流、预处理+生化处理、中水回用。\n【固废】特征：工业废渣、危废。防治：综合利用，危废交由有资质单位处置。\n【噪声】特征：风机、设备噪声。防治：隔声减振、厂区绿化降噪。\n【生态】特征：土地占用、植被破坏。防治：土地复垦、厂区绿化。"}], "questions": []}, {"ch": "第十章", "title": "环境监察与公众参与", "items": [{"title": "一、环境监察", "content": "现场监督排污企业、核查治理设施运行、调查污染纠纷、查处环境违法行为。"}, {"title": "二、污染源监察", "content": "核查排污申报、在线监控、排污口规范化管理。"}, {"title": "三、公众参与", "content": "公众：社会公民、社会组织、媒体。参与途径：①参与规划环评项目环评听证会 ②监督企业排污举报违法行为（12369）③参与环境质量监督社区环保志愿活动 ④通过人大社会组织提出环保政策建议 ⑤依法申请环境信息公开。"}], "questions": [{"q": "什么是公众？对于环境管理公众怎么参与？", "a": "公众：社会公民、社会组织、媒体。参与途径：①参与规划环评项目环评听证会 ②监督企业排污举报违法行为（12369）③参与环境质量监督社区环保志愿活动 ④通过人大社会组织提出环保政策建议 ⑤依法申请环境信息公开。"}, {"q": "环境监察的含义分类特点和工作程序是什么？", "a": "含义：现场监督排污企业核查治理设施运行调查污染纠纷查处违法行为。分类：环境现场监察、污染源监察、污染防治设施监察、建设项目监察。特点：五公开（制度程序结果投诉渠道廉政纪律）。工作程序：准备→现场检查→取证→处理→跟踪回访。"}, {"q": "污染源监察的含义实质一般内容和形式是什么？", "a": "含义：对排放污染物的单位和个人进行监督检查。实质：运用法律行政技术手段监控污染源确保达标排放。内容：排污申报、设施运行、达标排放、总量控制、制度落实。形式：定期检查、不定期抽查、专项检查、暗访。"}]}]</script>
<script>
var D=JSON.parse(document.getElementById('d').textContent);
function render(){var c=document.getElementById('chapters');var h='';var t=0;D.forEach(function(ch,i){var ni=ch.items?ch.items.length:0;var nq=ch.questions?ch.questions.length:0;t+=nq;h+='<div class="chapter-card"><div class="chapter-header" onclick="tc('+i+')"><div><span class="ch-num">'+ch.ch+'</span><strong>'+ch.title+'</strong><span class="q-count">'+(ni>0?ni+'知识点 | ':'')+nq+'题</span></div><span class="arrow" id="a'+i+'">▼</span></div><div class="chapter-body" id="b'+i+'">';if(ni>0){h+='<div class="section-label">📖 知识点</div>';ch.items.forEach(function(it,k){h+='<div class="item-box"><div class="item-title" onclick="tk(\'i'+i+'_'+k+'\')">▶ '+it.title+'</div><div class="item-content" id="i'+i+'_'+k+'">'+it.content+'</div></div>'})}if(nq>0){h+='<div class="section-label">📝 习题</div>';ch.questions.forEach(function(q,j){var gi=gIdx(i,j);h+='<div class="q-item"><div class="q-text"><span class="q-num">'+gi+'.</span>'+q.q+'</div><button class="btn-answer" id="b_'+i+'_'+j+'" onclick="ta('+i+','+j+')">显示答案</button><div class="a-box" id="a_'+i+'_'+j+'"><span class="a-label">✅ 答案：</span>'+q.a+'</div></div>'})}h+='</div></div>'});c.innerHTML=h;document.getElementById('tq').textContent=t;document.getElementById('tc').textContent=D.length}
function gIdx(i,j){var n=0;for(var k=0;k<i;k++)n+=D[k].questions.length;return n+j+1}
function tc(i){var b=document.getElementById('b'+i);var a=document.getElementById('a'+i);b.classList.toggle('open');a.classList.toggle('open')}
function tk(id){var e=document.getElementById(id);e.classList.toggle('show')}
function ta(i,j){var a=document.getElementById('a_'+i+'_'+j);var b=document.getElementById('b_'+i+'_'+j);a.classList.toggle('show');b.textContent=a.classList.contains('show')?'隐藏答案':'显示答案';b.classList.toggle('showing')}
var as=false;function toggleAll(){as=!as;D.forEach(function(ch,i){ch.questions.forEach(function(_,j){var a=document.getElementById('a_'+i+'_'+j);var b=document.getElementById('b_'+i+'_'+j);if(a){if(as){a.classList.add('show');b.textContent='隐藏答案';b.classList.add('showing')}else{a.classList.remove('show');b.textContent='显示答案';b.classList.remove('showing')}}});var bo=document.getElementById('b'+i);var ar=document.getElementById('a'+i);if(as){bo.classList.add('open');ar.classList.add('open')}})}
function searchQ(){var q=document.getElementById('s').value.trim().toLowerCase();var n=0;D.forEach(function(ch,i){var hv=false;var items=document.querySelectorAll('.chapter-card:nth-child('+(i+1)+') .q-item');items.forEach(function(item,j){var qt=(ch.questions[j]?ch.questions[j].q:'').toLowerCase();var at=(ch.questions[j]?ch.questions[j].a:'').toLowerCase();var m=!q||qt.includes(q)||at.includes(q);item.style.display=m?'block':'none';if(m)hv=true});var card=document.querySelectorAll('.chapter-card')[i];if(card)card.style.display=hv?'block':'none';if(hv)n++});document.getElementById('nm').classList.toggle('hidden',n>0||!q)}
render();
</script>
</body>
</html>
